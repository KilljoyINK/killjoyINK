<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — INK LABS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- model-viewer for AR (iOS Quick Look + Android Scene Viewer) -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    .vault-wrap {
      max-width: 516px;
      margin: 0 auto;
      padding-bottom: 80px;
      border-left: 1px solid var(--gray-mid);
      border-right: 1px solid var(--gray-mid);
    }
    .vault-header {
      padding: 52px 36px 32px;
      border-bottom: 1px solid var(--gray-mid);
      display: flex; align-items: flex-end;
      justify-content: space-between; gap: 24px;
    }
    .vault-title {
      font-family: var(--display);
      font-size: clamp(40px,6vw,72px);
      line-height: 0.92; letter-spacing: 0.04em;
    }
    .vault-meta {
      text-align: right; font-size: 9px;
      letter-spacing: 0.18em; color: rgba(255,255,255,0.22); line-height: 2.1;
    }

    /* Filter */
    .filter-bar {
      position: sticky; top: 52px; z-index: 90;
      display: flex; align-items: stretch;
      border-bottom: 1px solid var(--gray-mid);
      background: rgba(0,0,0,0.95); backdrop-filter: blur(8px);
      overflow-x: auto; scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-btn {
      background: none; border: none;
      border-right: 1px solid var(--gray-mid);
      font-family: var(--mono); font-size: 9px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(255,255,255,0.3); padding: 11px 20px;
      cursor: pointer; white-space: nowrap;
      transition: color 0.15s, background 0.15s;
    }
    .filter-btn:hover  { color: var(--white); background: rgba(255,255,255,0.03); }
    .filter-btn.active { color: var(--white); }
    .filter-count {
      margin-left: auto; display: flex; align-items: center;
      padding: 0 20px; font-size: 9px; letter-spacing: 0.15em;
      color: rgba(255,255,255,0.18); border-left: 1px solid var(--gray-mid); white-space: nowrap;
    }

    /* Grid */
    .vault-grid { display: grid; grid-template-columns: repeat(3,1fr); }
    .vault-card {
      border-right: 1px solid var(--gray-mid);
      border-bottom: 1px solid var(--gray-mid);
      cursor: pointer; position: relative;
      text-decoration: none; display: block;
      transition: background 0.18s;
    }
    .vault-card:nth-child(3n) { border-right: none; }
    .vault-card:hover { background: rgba(255,255,255,0.02); }
    .vault-card[data-hidden="true"] { display: none; }

    /* 3D viewer pane */
    .vc-viewer {
      width: 100%; aspect-ratio: 1;
      position: relative; background: #000; overflow: hidden;
    }
    .vc-viewer canvas {
      position: absolute; inset: 0;
      width: 100% !important; height: 100% !important; display: block;
    }
    .vc-viewer::after {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px; pointer-events: none; z-index: 2;
    }
    .vc-loader {
      position: absolute; inset: 0; z-index: 3;
      display: flex; align-items: center; justify-content: center;
      font-size: 7px; letter-spacing: 0.22em;
      color: rgba(255,255,255,0.15); pointer-events: none;
      animation: blink 1.6s step-end infinite; transition: opacity 0.3s;
    }
    .vc-loader.hidden { opacity: 0; }

    /* "OPEN →" hover overlay */
    .vc-open {
      position: absolute; inset: 0; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--white); background: rgba(0,0,0,0.55);
      opacity: 0; transition: opacity 0.22s; pointer-events: none;
    }
    .vault-card:hover .vc-open { opacity: 1; }

    /* AR button — bottom-right of viewer */
    .vc-ar-btn {
      position: absolute; bottom: 10px; right: 10px;
      z-index: 6;
      display: none;           /* shown only when AR available */
      align-items: center; gap: 5px;
      background: rgba(0,0,0,0.7);
      border: 1px solid rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.75);
      font-family: var(--mono); font-size: 7px;
      letter-spacing: 0.18em; text-transform: uppercase;
      padding: 5px 9px;
      cursor: pointer;
      pointer-events: all;
      transition: border-color 0.2s, color 0.2s;
    }
    .vc-ar-btn:hover { border-color: var(--white); color: var(--white); }
    .vc-ar-btn svg { flex-shrink: 0; }

    /* AR button visible on all devices */
    .vc-ar-btn { display: flex; }

    /* Card meta */
    .vc-meta { padding: 12px 16px 16px; border-top: 1px solid var(--gray-mid); }
    .vc-name { font-family: var(--sans); font-weight: 700; font-size: 12px; color: var(--white); margin-bottom: 4px; }
    .vc-sub  { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .vc-cat  { font-size: 7px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.28); }
    .vc-year { font-size: 7px; letter-spacing: 0.1em; color: rgba(255,255,255,0.16); }

    /* Description line */
    .vc-desc {
      font-size: 10px;
      color: rgba(255,255,255,0.35);
      line-height: 1.6;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 8px;
      margin-top: 4px;
    }

    /* Hidden model-viewer elements used for AR only */
    .ar-mv-pool { display: none; }

    @media (max-width: 700px) {
      .vault-wrap { max-width: 100%; border-left: none; border-right: none; }
      .vault-grid { grid-template-columns: repeat(2,1fr); }
      .vault-card:nth-child(3n) { border-right: 1px solid var(--gray-mid); }
      .vault-card:nth-child(2n) { border-right: none; }
    }
    @media (max-width: 440px) {
      .vault-grid { grid-template-columns: 1fr; }
      .vault-card { border-right: none !important; }
    }
  </style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">INK LABS <span>ENG·RESEARCH·DIVISION</span></a>
  <ul class="nav-links">
    <li><a href="projects.html" class="active">Projects</a></li>
    <li><a href="film.html">Film</a></li>
    <li><a href="experimental.html">Experimental</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-status">SYSTEMS ONLINE</div>
</nav>

<main>
<div class="vault-wrap">

  <div class="vault-header">
    <div class="vault-title">THE<br>VAULT</div>
    <div class="vault-meta">9 OBJECTS<br>2022 — 2024<br>INTERACTIVE</div>
  </div>

  <div class="filter-bar">
    <button class="filter-btn active" data-cat="all">All</button>
    <button class="filter-btn" data-cat="autonomous">Autonomous</button>
    <button class="filter-btn" data-cat="embedded">Embedded</button>
    <button class="filter-btn" data-cat="vision">Vision</button>
    <button class="filter-btn" data-cat="structures">Structures</button>
    <span class="filter-count" id="filterCount">9 OBJECTS</span>
  </div>

  <div class="vault-grid" id="vaultGrid"></div>

</div>
</main>

<!-- Hidden model-viewer pool for AR — one per project -->
<div class="ar-mv-pool" id="arPool"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const PROJECTS = [
  { id:'001', name:'Autonomous Ground Vehicle', cat:'autonomous', year:'2024', model:'./models/project-001.glb', desc:'Full-stack autonomous navigation integrating LiDAR, stereo vision, and real-time path planning.' },
  { id:'002', name:'Soft Actuator System',       cat:'embedded',   year:'2024', model:'./models/project-002.glb', desc:'Pneumatic soft-robot actuator array with closed-loop pressure control and FEA-based simulation.' },
  { id:'003', name:'Structural Health Monitor',  cat:'structures', year:'2023', model:'./models/project-003.glb', desc:'Distributed wireless sensor network for real-time fatigue monitoring across civil infrastructure.' },
  { id:'004', name:'LiDAR Terrain Mapping',      cat:'vision',     year:'2023', model:'./models/project-004.glb', desc:'Point-cloud pipeline achieving sub-centimeter terrain reconstruction at 50 Hz.' },
  { id:'005', name:'Exoskeleton Controller',     cat:'embedded',   year:'2023', model:'./models/project-005.glb', desc:'Adaptive impedance controller for lower-limb exoskeleton with gait-phase prediction via sEMG.' },
  { id:'006', name:'Aerial Swarm System',        cat:'autonomous', year:'2024', model:'./models/project-006.glb', desc:'16-agent UAV swarm for coordinated search and mapping in GPS-denied environments.' },
  { id:'007', name:'Custom IMU Array',           cat:'embedded',   year:'2023', model:'./models/project-007.glb', desc:'Nine-axis sensor fusion with extended Kalman filter, achieving sub-0.05° orientation error.' },
  { id:'008', name:'Stereo Vision Pipeline',     cat:'vision',     year:'2022', model:'./models/project-008.glb', desc:'Real-time stereo depth estimation optimised for edge deployment on NVIDIA Jetson.' },
  { id:'009', name:'Bare-Metal RTOS Platform',   cat:'embedded',   year:'2022', model:'./models/project-009.glb', desc:'Deterministic firmware for STM32H7 targeting cycle-accurate 1 kHz control loops.' },
];

/* AR icon SVG */
const AR_ICON = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
</svg>`;

/* Build grid */
const grid = document.getElementById('vaultGrid');
const pool = document.getElementById('arPool');

grid.innerHTML = PROJECTS.map(p => `
  <a class="vault-card" href="project-${p.id}.html" data-cat="${p.cat}">
    <div class="vc-viewer" id="pv-${p.id}">
      <canvas id="pc-${p.id}"></canvas>
      <div class="vc-loader" id="pl-${p.id}">INIT…</div>
      <div class="vc-open">OPEN →</div>
      <button class="vc-ar-btn" id="ar-${p.id}" title="View in AR">
        ${AR_ICON} AR
      </button>
    </div>
    <div class="vc-meta">
      <div class="vc-name">${p.name}</div>
      <div class="vc-sub">
        <span class="vc-cat">${p.cat}</span>
        <span class="vc-year">${p.year}</span>
      </div>
      <div class="vc-desc">${p.desc}</div>
    </div>
  </a>`).join('');

/* Create hidden model-viewers for AR */
PROJECTS.forEach(p => {
  const mv = document.createElement('model-viewer');
  mv.id          = 'mv-' + p.id;
  mv.src         = p.model;
  mv.setAttribute('ar', '');
  mv.setAttribute('ar-modes', 'webxr scene-viewer quick-look');
  mv.setAttribute('ar-scale', 'auto');
  mv.setAttribute('camera-controls', '');
  mv.style.width  = '1px';
  mv.style.height = '1px';
  mv.style.opacity = '0';
  mv.style.position = 'absolute';
  mv.style.pointerEvents = 'none';
  pool.appendChild(mv);

  /* Wire AR button — stop propagation so card link doesn't fire */
  const btn = document.getElementById('ar-' + p.id);
  if (btn) {
    btn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      mv.activateAR();
    });
  }
});

/* Filter */
const btns  = document.querySelectorAll('.filter-btn');
const cards = document.querySelectorAll('.vault-card');
const count = document.getElementById('filterCount');
btns.forEach(b => b.addEventListener('click', () => {
  btns.forEach(x => x.classList.remove('active')); b.classList.add('active');
  let v = 0;
  cards.forEach(c => {
    const show = b.dataset.cat === 'all' || c.dataset.cat === b.dataset.cat;
    c.dataset.hidden = !show;
    if (show) v++;
  });
  count.textContent = v + ' OBJECT' + (v !== 1 ? 'S' : '');
}));

/* Three.js viewers */
const loader = new THREE.GLTFLoader();

function initCard(p) {
  const id  = p.id;
  const vEl = document.getElementById('pv-' + id);
  const cEl = document.getElementById('pc-' + id);
  const lEl = document.getElementById('pl-' + id);
  const href = vEl?.closest('.vault-card')?.getAttribute('href');
  if (!vEl || !cEl) return;

  /* Navigate on clean tap; ignore drags */
  let ox = 0, oy = 0, drag = false;
  vEl.addEventListener('pointerdown', e => { ox = e.clientX; oy = e.clientY; drag = false; });
  vEl.addEventListener('pointermove', e => { if (Math.abs(e.clientX-ox)>6 || Math.abs(e.clientY-oy)>6) drag = true; });
  vEl.addEventListener('pointerup',   () => { if (!drag && href) window.location.href = href; });

  const R = new THREE.WebGLRenderer({ canvas: cEl, antialias: true });
  R.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  R.outputEncoding = THREE.sRGBEncoding;
  R.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  const cam   = new THREE.PerspectiveCamera(45, 1, 0.001, 500);

  const ctrl = new THREE.OrbitControls(cam, vEl);
  ctrl.enableDamping = true; ctrl.dampingFactor = 0.07;
  ctrl.enablePan = false; ctrl.enableZoom = false;
  ctrl.autoRotate = true; ctrl.autoRotateSpeed = 1.0;
  ctrl.addEventListener('start', () => { ctrl.autoRotate = false; });

  scene.add(new THREE.AmbientLight(0xffffff, 0.5));
  const k = new THREE.DirectionalLight(0xffffff, 1.0); k.position.set(3,4,3); scene.add(k);
  scene.add(Object.assign(new THREE.DirectionalLight(0xffffff, 0.3), { position: new THREE.Vector3(-3,1,-2) }));

  const g = new THREE.GridHelper(6,12, 0x1e1e1e, 0x111111); scene.add(g);

  const resize = () => {
    const w = vEl.clientWidth, h = vEl.clientHeight;
    if (!w || !h) return;
    R.setSize(w, h, false); cam.aspect = w/h; cam.updateProjectionMatrix();
  };
  new ResizeObserver(resize).observe(vEl); resize();
  (function loop() { requestAnimationFrame(loop); ctrl.update(); R.render(scene, cam); })();

  loader.load(p.model,
    gltf => {
      const m   = gltf.scene;
      const box = new THREE.Box3().setFromObject(m);
      const sz  = box.getSize(new THREE.Vector3());
      const cen = box.getCenter(new THREE.Vector3());
      const mx  = Math.max(sz.x, sz.y, sz.z), sc = 1.5 / mx;
      m.scale.setScalar(sc);
      m.position.sub(cen.multiplyScalar(sc));
      const b2 = new THREE.Box3().setFromObject(m);
      m.position.y -= b2.min.y; g.position.y = b2.min.y - 0.003;
      cam.position.set(0, sz.y*sc*0.6, mx*sc*1.1);
      ctrl.target.set(0, sz.y*sc*0.3, 0); ctrl.update();
      scene.add(m);
      if (lEl) lEl.classList.add('hidden');
    },
    xhr => { if (lEl && xhr.total) lEl.textContent = Math.round(xhr.loaded/xhr.total*100) + '%'; },
    () => {
      if (lEl) lEl.classList.add('hidden');
      const ph = new THREE.Group();
      ph.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.5,1), new THREE.MeshStandardMaterial({ color:0xffffff, wireframe:true, opacity:0.16, transparent:true })));
      ph.add(new THREE.Mesh(new THREE.IcosahedronGeometry(0.45,1), new THREE.MeshStandardMaterial({ color:0x040404 })));
      let t = Math.random() * Math.PI * 2;
      (function s() { requestAnimationFrame(s); t += 0.006; ph.rotation.y = t; })();
      scene.add(ph); cam.position.set(0, 0.2, 1.0); ctrl.target.set(0,0,0); ctrl.update();
    }
  );
}

PROJECTS.forEach(p => initCard(p));
</script>
</body>
</html>
